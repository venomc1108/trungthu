<!DOCTYPE html>
<html lang="vi">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

    <div class="shader-layer"></div>

            <stop offset="0%"  stop-color="#fff3c9" stop-opacity="0.85"/>

            <stop offset="100%" stop-color="#ffd966" stop-opacity="0"/>

            <stop offset="100%" stop-color="#b98a4c"/>
          </linearGradient>
          <linearGradient id="cuoiPants" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#5a3a1e"/>
            <stop offset="100%" stop-color="#2b1a0d"/>
          </linearGradient>
        </defs>

        <circle cx="110" cy="140" r="115" fill="url(#cuoiHalo)"/>

        <path d="M80 144 Q78 158 82 168" stroke="#4a2f18" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        <path d="M96 144 Q98 158 94 168" stroke="#4a2f18" stroke-width="1.4" fill="none" stroke-linecap="round"/>

        <button class="modal-close" id="modalClose" aria-label="Đóng">✕</button>
        <div class="modal-title" id="modalTitle">Gửi cậu</div>
        <div class="modal-image">
          <img id="modalImg" src="" alt="Trung Thu">
          <div class="modal-image-shine"></div>
        </div>
        <div class="modal-poem" id="modalPoem"></div>
        <div class="modal-footer">
          <span class="dots">✦</span> TRUNG THU AN LÀNH <span class="dots">✦</span>
        </div>
      </div>
    </div>

  </div><!-- /.app-stage -->

  <audio id="bgMusic" loop preload="auto">
    <source src="aa.mp3" type="audio/mpeg">
    Trình duyệt không hỗ trợ phát nhạc.
  </audio>

  <script src="script.js"></script>
